user www-data;
worker_processes 1;
pid /run/nginx/nginx.pid;

events {
    worker_connections 512;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;
    client_max_body_size 32m;

    server {
        listen 80 default_server;
        # Independent domains all reach this server block; WordPress resolves sites.
        server_name _;
        root /var/www/html;
        index index.php;

        location / {
            try_files $uri $uri/ /index.php?$args;
        }

        # Minimal Subdirectory Multisite dispatch: these are virtual child paths,
        # while wp-login.php and wp-admin are physically present only at root.
        location ~ ^/[^/]+/wp-login\.php$ {
            rewrite ^/[^/]+/wp-login\.php$ /wp-login.php last;
        }

        location ~ ^/[^/]+/wp-admin/?$ {
            rewrite ^/[^/]+/wp-admin/?$ /wp-admin/index.php last;
        }

        location ~ ^/[^/]+/wp-admin/(.*)$ {
            rewrite ^/[^/]+/wp-admin/(.*)$ /wp-admin/$1 last;
        }

        # WordPress subsite URLs may prefix shared network assets with the site
        # path; the files themselves live at the network document-root paths.
        location ~ ^/[^/]+/(wp-includes|wp-content)/(.*)$ {
            rewrite ^/[^/]+/(wp-includes|wp-content)/(.*)$ /$1/$2 last;
        }

        location ~ \.php$ {
            try_files $uri =404;
            fastcgi_split_path_info ^(.+\.php)(/.+)$;
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            # Gerdoo terminates TLS before forwarding to this container.
            fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
            fastcgi_param HTTP_X_FORWARDED_HOST $http_x_forwarded_host;
            fastcgi_param HTTPS $https if_not_empty;
        }

        location ~ /\.ht {
            deny all;
        }
    }
}
